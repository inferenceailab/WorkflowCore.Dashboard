name: Bug report
description: Something in the dashboard does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go to the **Security** tab instead, see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a workflow ...
        2. Open the instance page ...
        3. See ...
    validations:
      required: true
  - type: input
    id: dashboard-version
    attributes:
      label: Dashboard version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: workflowcore-version
    attributes:
      label: Workflow Core version
      placeholder: 3.21.0
    validations:
      required: true
  - type: input
    id: dotnet-version
    attributes:
      label: .NET version
      placeholder: "10.0"
  - type: dropdown
    id: persistence
    attributes:
      label: Workflow Core persistence provider
      options:
        - In-memory
        - SQL Server
        - PostgreSQL
        - MySQL
        - SQLite
        - Oracle
        - MongoDB
        - RavenDB
        - Redis
        - Azure (Cosmos DB / Table Storage)
        - AWS DynamoDB
        - Other
  - type: dropdown
    id: journal
    attributes:
      label: Dashboard journal
      options:
        - In-memory (default)
        - Entity Framework
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 140, Firefox 145 ...
  - type: textarea
    id: logs
    attributes:
      label: Logs or errors
      description: Server logs, browser console errors. Remove anything sensitive.
      render: text
