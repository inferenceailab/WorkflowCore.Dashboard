version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Packages deliberately reference the lowest supported versions; host apps pick newer ones.
      - dependency-name: Microsoft.EntityFrameworkCore.*
        update-types: [version-update:semver-major]
      - dependency-name: Microsoft.Extensions.FileProviders.Embedded
        update-types: [version-update:semver-major]
      # One reference per target framework; each must stay on its framework's major version.
      - dependency-name: Microsoft.AspNetCore.Authentication.OpenIdConnect
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /src/WorkflowCore.Dashboard.UI
    schedule:
      interval: weekly
    ignore:
      # Angular supports one TypeScript minor version at a time (22.x: >=6.0 <6.1); `ng update` moves it.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Angular majors come with code migrations that only `ng update` runs.
      - dependency-name: "@angular/*"
        update-types: [version-update:semver-major]
      - dependency-name: "@angular-devkit/*"
        update-types: [version-update:semver-major]
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "typescript"]
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
