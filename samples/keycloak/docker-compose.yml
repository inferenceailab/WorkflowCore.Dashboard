# A local Keycloak for trying dashboard sign-in. Development only: plain HTTP, fixed passwords.
#   docker compose -f samples/keycloak/docker-compose.yml up -d
#   dotnet run --project samples/WorkflowCore.Dashboard.Sample --launch-profile Keycloak
# Then open http://localhost:5290/workflows and sign in as ada/ada (admin), val/val (viewer) or mo/mo (no access).
# Keycloak's own console: http://localhost:8180 (admin/admin).
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./workflows-realm.json:/opt/keycloak/data/import/workflows-realm.json:ro
